services:
  - type: web
    name: fathom-api
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci && npm run build && npx prisma migrate deploy && npm run db:seed
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
